<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <script>
    // Ultra-safe error handler for legacy browsers
    window.onerror = function (msg, url, line, col, error) {
      var div = document.createElement('div');
      div.style.cssText = "position:fixed;top:0;left:0;width:100%;height:100%;background:red;color:white;z-index:999999;padding:20px;font-size:12px;overflow:auto;";
      div.innerHTML = "<h2>[HTML LEVEL ERROR]</h2>" +
        "<p>Message: " + msg + "</p>" +
        "<p>URL: " + url + "</p>" +
        "<p>Line: " + line + ":" + col + "</p>" +
        (error && error.stack ? "<pre>" + error.stack + "</pre>" : "");
      document.body.appendChild(div);
      return false;
    };
  </script>
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#FF8C69" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Peach Chat</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
